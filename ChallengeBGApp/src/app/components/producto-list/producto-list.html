<div class="container">
    <div class="container-header">
        <h2>Productos</h2>
        <button matButton="outlined" (click)="openModal()">
            <mat-icon>add</mat-icon>
            Nuevo producto
        </button>
    </div>

    <mat-form-field appearance="outline" class="filtro">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Monitor">
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="mat-elevation-z2 tabla">
        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef> Producto </th>
                <td mat-cell *matCellDef="let row"> {{row.nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="descripcion">
                <th mat-header-cell *matHeaderCellDef> Descripción </th>
                <td mat-cell *matCellDef="let row"> {{row.descripcion}} </td>
            </ng-container>

            <ng-container matColumnDef="precios">
                <th mat-header-cell *matHeaderCellDef> Precios por proveedor </th>
                <td mat-cell *matCellDef="let row">
                    <table class="tablaPrecios">
                                            <thead>
                            <tr>
                                <th>Proveedor</th>
                                <th>Lote</th>
                                <th>Precio</th>
                                <th>Stock</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (precio of row.precios; track $index) {
                            <tr>
                                <td>{{precio.proveedorNombre}}</td>
                                <td>{{precio.numeroLote}}</td>
                                <td>{{precio.precio | currency}}</td>
                                <td>{{precio.stock}}</td>
                            </tr>
                            }
                        </tbody>
                    </table>
                    <!-- 
                    @for (precio of row.precios; track $index) {
                    <div class="precio">
                        {{precio.proveedorNombre}} - Lote {{precio.numeroLote}} -
                        {{precio.precio | currency}} - {{precio.precioConIva | currency}} - Stock {{precio.stock}}
                    </div>
                    }
                    -->
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button aria-label="Editar" (click)="openModal(row.id)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button aria-label="Eliminar" (click)="deleteProducto(row.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell sin-datos" colspan="4">No hay productos</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Seleccionar página"></mat-paginator>
    </div>
</div>
