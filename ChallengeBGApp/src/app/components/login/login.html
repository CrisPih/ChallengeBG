<div class="container">
    <mat-card appearance="outlined">
        <mat-card-content>
            <h2>Iniciar sesión</h2>

            <form class="formLogin" (submit)="login($event)">
                <mat-form-field appearance="outline">
                    <mat-label>Usuario</mat-label>
                    <input matInput autocomplete="username" [formField]="loginForm.nombreUsuario">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Clave</mat-label>
                    <input matInput type="password" autocomplete="current-password" [formField]="loginForm.clave">
                </mat-form-field>
                
                @if (mensajeError()) {<p class="mensajeError">{{ mensajeError() }}</p>}

                <button matButton="filled" type="submit" [disabled]="loginForm().invalid() || cargando()">
                    Ingresar
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
